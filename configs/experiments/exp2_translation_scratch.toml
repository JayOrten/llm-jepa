# Experiment 2: Train 175M model from scratch on OPUS translation.
# Tests whether STP helps from-scratch training (not just fine-tuning).
# For slurm cluster with 8 GPUs.
#
# Using all ~8.5M opus examples, 3 epochs. With 8 GPUs, batch=32*8=256 effective
# per grad step, ~33k steps/epoch, ~10-12 hours total.
#
# Regular:
#   sbatch scripts/slurm_train.sh configs/experiments/exp2_translation_scratch.toml regular
# STP:
#   sbatch scripts/slurm_train.sh configs/experiments/exp2_translation_scratch.toml stp

[model]
name = "configs/models/llama-175m"
tokenizer_name = "meta-llama/Llama-3.2-1B-Instruct"
use_lora = false
pretrain = true

[data]
train_file = "datasets/opus_train.jsonl"
eval_file = "datasets/opus_eval.jsonl"
max_length = 256
plain = true
train_all = false
max_eval_samples = 1000

[training]
output_dir = "./output-exp2"
batch_size = 32
grad_accum = 1
learning_rate = 3e-4
lr_scheduler_type = "cosine"
warmup_steps = 2000
weight_decay = 0.1
num_epochs = 3
eval_steps = 500
seed = 42
enable_save = true
eval_gen_samples = 100
eval_gen_every = 2

[strategy]
name = "regular"
lambda_ = 0.02
last_token = -2
loss_type = "cosine"

[strategy.stp]
linear_mode = "random_span"

[evaluation]
original_model_name = "configs/models/llama-175m"
