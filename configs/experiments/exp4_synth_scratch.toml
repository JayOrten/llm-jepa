# Experiment 1: Replicate STP paper results on NL-RX-SYNTH.
# Finetune Llama-3.2-1B-Instruct with LoRA. Local GPU (4080 12GB).
# Paper reports: Regular ~55%, STP ~84%.
#
# Regular:
#   python train.py --config configs/experiments/exp1_synth_finetune.toml --set strategy.name=regular --set training.output_dir=./output-exp1-regular
# STP:
#   python train.py --config configs/experiments/exp1_synth_finetune.toml --set training.output_dir=./output-exp1-stp

[model]
name = "meta-llama/Llama-3.2-1B-Instruct"
use_lora = false
pretrain = true

[data]
train_file = "datasets/synth_train.jsonl"
eval_file = "datasets/synth_test.jsonl"
max_length = 128

[training]
output_dir = "./output-exp4-regular"
batch_size = 8
grad_accum = 4
learning_rate = 2e-5
num_epochs = 4
eval_steps = 50
seed = 82
enable_save = true
eval_gen_samples = 50
eval_gen_every = 2

[strategy]
name = "regular"
lambda_ = 0.02
last_token = -2
loss_type = "cosine"

[strategy.stp]
linear_mode = "random_span"

[evaluation]
original_model_name = "meta-llama/Llama-3.2-1B-Instruct"
