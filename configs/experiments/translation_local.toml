# Local training on a single GPU (tested on 4080 12GB).
# ~50 min/epoch, 2 epochs = ~1.5-2 hours total per strategy.
#
# Regular baseline:
#   python train.py --config configs/experiments/translation_local.toml
# STP:
#   python train.py --config configs/experiments/translation_local.toml --set strategy.name=stp

[model]
name = "configs/models/llama-350m"
tokenizer_name = "meta-llama/Llama-3.2-1B-Instruct"
use_lora = false
pretrain = true

[data]
train_file = "datasets/opus_train.jsonl"
eval_file = "datasets/opus_eval.jsonl"
max_length = 256
plain = true
train_all = false
max_train_samples = 100000
max_eval_samples = 500

[training]
output_dir = "./output-local"
batch_size = 4
grad_accum = 4
learning_rate = 3e-4
lr_scheduler_type = "cosine"
warmup_steps = 200
weight_decay = 0.1
num_epochs = 2
eval_steps = 100
seed = 42
enable_save = true
eval_gen_samples = 50
eval_gen_every = 3

[strategy]
name = "regular"
lambda_ = 0.02
last_token = -2
loss_type = "cosine"

[strategy.stp]
linear_mode = "random_span"

[evaluation]
original_model_name = "configs/models/llama-350m"
